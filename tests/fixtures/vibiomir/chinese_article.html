    <h1>HER2阳性乳腺癌患者的靶向治疗指南</h1>
    <p>在乳腺癌患者中，HER2过表达与侵袭性肿瘤生物学行为密切相关。抗HER2靶向治疗（如曲妥珠单抗）显著改善了患者的无病生存期。</p>
    <h2>临床监测要点</h2>
    <p>患者血清K+浓度及心功能应在治疗期间密切监测。对于出现TNF-α升高及严重不良反应的病例，建议及时调整剂量或暂停治疗。</p>
